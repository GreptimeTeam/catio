[package]
name = "catio"
version = "0.1.0"
edition = "2021"
authors = ["Ruihang Xia <waynestxia@gmail.com>"]
license = "MIT or Apache-2.0"

[features]
default = []
# The original Linux AIO prototype depends on libaio being installed on the
# target system. The Tokio task scheduler itself has no native dependencies.
linux-aio = ["dep:libc", "dep:nix", "dep:thiserror"]

[dependencies]
libc = { version = "0.2.119", optional = true }
nix = { version = "0.23.1", optional = true }
thiserror = { version = "1.0.30", optional = true }
tokio = { version = "1.17.0", features = ["rt"] }

[dev-dependencies]
tempfile = "3.2.0"
tokio = { version = "1.17.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
